# Nginx SINERGI: TLS, HSTS, CSP ketat, proksi /api, batas laju login. Hanya jaringan internal/VPN.
limit_req_zone $binary_remote_addr zone=sinergi_auth:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/sinergi.crt;
    ssl_certificate_key /etc/nginx/tls/sinergi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Daftar IP yang diizinkan (aktifkan di produksi):
    # include /etc/nginx/allowlist.conf;   # isi: allow 10.65.0.0/16; ... deny all;

    client_max_body_size 25m;   # unggah templat xlsx

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location /api/auth/ {
        limit_req zone=sinergi_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
