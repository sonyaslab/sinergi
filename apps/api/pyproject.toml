[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinergi_api"
version = "0.1.0"
description = "SINERGI (Sistem Neraca Ekonomi Regional Terintegrasi) - API dan mesin hitung PDRB triwulanan lapangan usaha"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "alembic==1.14.0",
  "argon2-cffi==23.1.0",
  "pyotp==2.9.0",
  "pyjwt==2.10.1",
  "cryptography==44.0.0",
  "segno==1.6.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.13.0",
]

# apps/api adalah paket sinergi_api (jalur di CLAUDE.md tetap: apps/api/engine/ = sinergi_api.engine).
[tool.setuptools]
package-dir = { "sinergi_api" = "." }
packages = [
  "sinergi_api",
  "sinergi_api.app",
  "sinergi_api.auth",
  "sinergi_api.master",
  "sinergi_api.data_dasar",
  "sinergi_api.impor",
  "sinergi_api.engine",
  "sinergi_api.putaran",
  "sinergi_api.laporan",
  "sinergi_api.worker",
  "sinergi_api.migrations",
  "sinergi_api.migrations.versions",
]

[tool.setuptools.package-data]
"sinergi_api.migrations" = ["baseline/*.sql", "script.py.mako"]
"sinergi_api" = ["alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
markers = [
  "db: uji yang memerlukan PostgreSQL",
  "golden: uji golden (butuh folder golden/ di mesin internal)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["sinergi_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]
